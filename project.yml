name: PersonalCalendar
options:
  bundleIdPrefix: local.personalcalendar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PersonalCalendar:
    type: application
    platform: iOS
    sources:
      - path: PersonalCalendar
    dependencies:
      - target: PersonalCalendarWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personalcalendar.iphone
        PRODUCT_NAME: "My Calendar"
        PRODUCT_MODULE_NAME: PersonalCalendar
        CODE_SIGN_ENTITLEMENTS: PersonalCalendar/Resources/PersonalCalendar.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "My Calendar"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Show and manage your calendar events in one personal schedule."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Show and manage your reminders alongside your schedule."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PersonalCalendarWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PersonalCalendarWidgets
      - path: PersonalCalendar/TimetableShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personalcalendar.iphone.widgets
        PRODUCT_NAME: PersonalCalendarWidgets
        INFOPLIST_FILE: PersonalCalendarWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalCalendarWidgets/PersonalCalendarWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  PersonalCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonalCalendarTests
    dependencies:
      - target: PersonalCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personalcalendar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/My Calendar.app/My Calendar"
  PersonalCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PersonalCalendarUITests
    dependencies:
      - target: PersonalCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personalcalendar.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PersonalCalendar:
    build:
      targets:
        PersonalCalendar: all
        PersonalCalendarTests: [test]
        PersonalCalendarUITests: [test]
    test:
      targets:
        - PersonalCalendarTests
        - PersonalCalendarUITests
